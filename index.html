<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Super Clicker V5: Ultimate Edition</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --primary: #ff4757; --glass: rgba(15, 20, 25, 0.8); }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background: #0f172a; color: white; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .game-wrapper { display: grid; grid-template-columns: 280px 1fr 320px; gap: 20px; width: 95vw; max-width: 1400px; height: 90vh; }
        .panel { background: var(--glass); border-radius: 16px; padding: 20px; overflow-y: auto; border: 1px solid rgba(255,255,255,0.1); }
        h3 { margin: 0 0 10px 0; border-bottom: 1px solid #444; padding-bottom: 5px; color: #a5b4fc; }
        
        /* Center Area */
        .center-panel { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #main-btn { width: 200px; height: 200px; border-radius: 50%; font-size: 4rem; cursor: pointer; background: radial-gradient(circle, #f43f5e, #be123c); display: flex; align-items: center; justify-content: center; transition: 0.1s; }
        #main-btn:active { transform: scale(0.9); }
        
        /* Frenzy & Boss */
        #frenzy-bar { width: 200px; height: 10px; background: #333; border-radius: 5px; margin: 10px 0; overflow: hidden; }
        #frenzy-fill { height: 100%; width: 0%; background: #fbbf24; }
        #boss-area { display: none; text-align: center; background: rgba(255,0,0,0.2); padding: 20px; border-radius: 10px; }
        
        /* Shop & Artifacts */
        .shop-btn { width: 100%; padding: 10px; margin-bottom: 5px; background: rgba(255,255,255,0.05); border: none; color: white; cursor: pointer; border-radius: 8px; display: flex; justify-content: space-between; }
        .shop-btn:hover { background: rgba(255,255,255,0.1); }
        .artifact-card { background: rgba(255,215,0,0.1); padding: 8px; margin-bottom: 5px; font-size: 0.8rem; border-radius: 5px; }
        .toast { position: fixed; bottom: 20px; right: 20px; background: #10b981; padding: 15px; border-radius: 8px; z-index: 1000; }
    </style>
</head>
<body>

<div class="game-wrapper">
    <div class="panel">
        <h3>🏆 Xếp hạng & Cổ vật</h3>
        <div id="leaderboard" style="font-size: 0.8rem;"></div>
        <div id="artifact-list" style="margin-top:20px;"></div>
    </div>

    <div class="panel center-panel">
        <div id="event-banner" style="color: #fbbf24; margin-bottom: 10px; font-weight: bold; display: none;"></div>
        <div id="score" style="font-size: 3rem; font-weight: bold;">0</div>
        
        <div id="frenzy-bar"><div id="frenzy-fill"></div></div>
        
        <div id="main-btn">🪨</div>
        
        <div id="boss-area">
            <h3>🔥 BOSS ĐANG TẤN CÔNG!</h3>
            <button id="boss-btn" style="font-size: 3rem; cursor: crosshair;">🐲</button>
            <div id="boss-hp" style="width: 100%; height: 10px; background: #333;"><div id="boss-hp-fill" style="height:100%; background:red; width:100%;"></div></div>
        </div>
    </div>

    <div class="panel">
        <h3>🏗️ Tòa nhà (Auto)</h3>
        <div id="buildings-container"></div>
        <h3>🎲 Tính năng</h3>
        <button class="shop-btn" id="btn-gacha">🎁 Mở Rương (1.5k)</button>
        <button class="shop-btn" id="btn-summon-boss">⚔️ Gọi Boss (5k)</button>
        <button class="shop-btn" id="btn-prestige" style="color: #38bdf8;">🌌 Chuyển sinh (500k)</button>
    </div>
</div>

<script>
    // --- STATE ---
    let state = {
        score: parseFloat(localStorage.getItem("v5_score")) || 0,
        prestigeMult: parseFloat(localStorage.getItem("v5_prestige")) || 1,
        buildings: JSON.parse(localStorage.getItem("v5_buildings")) || {
            miner: { count: 0, cost: 50, cps: 1, name: "⛏️ Thợ mỏ" },
            factory: { count: 0, cost: 500, cps: 8, name: "🏭 Xưởng" }
        },
        artifacts: JSON.parse(localStorage.getItem("v5_artifacts")) || [],
        combo: 0
    };

    // --- CORE LOOP ---
    setInterval(() => {
        let cps = 0;
        for(let key in state.buildings) cps += state.buildings[key].count * state.buildings[key].cps;
        state.score += (cps * state.prestigeMult) / 10;
        updateUI();
    }, 100);

    // --- CLICK ---
    document.getElementById('main-btn').onclick = (e) => {
        state.score += (1 * state.prestigeMult);
        state.combo += 2;
        if(state.combo > 100) state.combo = 100;
        document.getElementById('frenzy-fill').style.width = state.combo + "%";
        updateUI();
    };

    // --- BUILDINGS ---
    function renderBuildings() {
        let html = '';
        for(let key in state.buildings) {
            let b = state.buildings[key];
            html += `<button class="shop-btn" onclick="buyBuilding('${key}')">${b.name} (${b.count}) <br> Giá: ${Math.floor(b.cost)}</button>`;
        }
        document.getElementById('buildings-container').innerHTML = html;
    }
    
    window.buyBuilding = (key) => {
        if(state.score >= state.buildings[key].cost) {
            state.score -= state.buildings[key].cost;
            state.buildings[key].count++;
            state.buildings[key].cost *= 1.2;
            updateUI();
        }
    };

    // --- BOSS FIGHT ---
    let bossHp = 1000;
    document.getElementById('btn-summon-boss').onclick = () => {
        if(state.score >= 5000) {
            state.score -= 5000;
            document.getElementById('main-btn').style.display = 'none';
            document.getElementById('boss-area').style.display = 'block';
            bossHp = 1000;
        }
    };
    
    document.getElementById('boss-btn').onclick = () => {
        bossHp -= 100;
        document.getElementById('boss-hp-fill').style.width = (bossHp/10) + "%";
        if(bossHp <= 0) {
            state.score += 20000;
            document.getElementById('main-btn').style.display = 'flex';
            document.getElementById('boss-area').style.display = 'none';
            alert("Thắng boss! Nhận 20k điểm.");
        }
    };

    // --- PRESTIGE ---
    document.getElementById('btn-prestige').onclick = () => {
        if(state.score >= 500000) {
            state.score = 0;
            state.prestigeMult *= 2;
            for(let key in state.buildings) state.buildings[key].count = 0;
            updateUI();
        }
    };

    // --- UPDATE UI ---
    function updateUI() {
        document.getElementById('score').innerText = Math.floor(state.score).toLocaleString();
        renderBuildings();
        localStorage.setItem("v5_score", state.score);
        localStorage.setItem("v5_prestige", state.prestigeMult);
        localStorage.setItem("v5_buildings", JSON.stringify(state.buildings));
    }

    updateUI();
</script>
</body>
</html>

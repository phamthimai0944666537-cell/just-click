<style>
button {
  width: 40vw;
  height: 40vw;
  border-radius: 50%;
  border: none;
  background: red;
  color: white; 
  font-size: 40px;
  cursor: pointer;
}
</style>
<style>
body {
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
}
</style>
<button id="btn">0</button>
<script>
let score = localStorage.getItem("score") || 0;
const btn = document.getElementById("btn");
btn.innerText = score;
btn.onclick = () => {
  score++;
  btn.innerText = score;
  localStorage.setItem("score", score);
};
</script>
